name: Tests

# IntraPaint's release rule is that changes only reach master via a PR made right before a release.
# This workflow turns that PR into an automated gate: the suite must pass headlessly before merge.
# workflow_dispatch also allows running it by hand from the Actions tab.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented minimum supported version; 3.12 guards against newer-version breakage.
        python-version: ['3.11', '3.12']
    env:
      # Belt-and-suspenders: conftest.py also sets this, but making it explicit keeps the job's intent
      # (run Qt with no display) obvious and independent of the test harness.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for headless Qt and libmypaint
        # PySide6's offscreen plugin still needs EGL/GL, xkbcommon, glib, dbus and fontconfig present.
        # The bundled Linux libmypaint.so (lib/libmypaint.so) links against libjson-c.so.5.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Cython extension
        # IntraPaint.py normally builds this on launch; tests import src.util.visual.image_fill
        # directly, so build it ahead of time.
        run: python setup.py build_ext --inplace

      - name: Run tests
        run: python -m pytest

name: random-order

# Runs the test suite in a shuffled order every week, so a test that depends on state an earlier test left behind
# fails here before it fails somewhere harder to trace. The seed is the run ID, printed in the pytest header as
# `--random-order-seed=...`; pass the same option to pytest to reproduce a run's order locally. A run started by hand
# from the Actions tab can take a seed.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: Seed for --random-order-seed. Empty uses the run ID.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: test (shuffled)
    runs-on: ubuntu-latest
    # The suite in its usual order takes up to 20 minutes in CI, and a shuffled order can run slower.
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # GitHub runs scheduled workflows from the default branch, master. Scheduled runs test integration instead.
        with:
          ref: ${{ github.event_name == 'schedule' && 'integration' || github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries
        # The same libraries ci.yml's test job installs, without gdb.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Cython extension
        run: python setup.py build_ext --inplace

      # The global bucket shuffles every test across the whole suite, so tests from different files interleave.
      - name: Run tests in a shuffled order
        run: python -m pytest --random-order-bucket=global --random-order-seed="$SEED"

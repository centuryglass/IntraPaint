name: ci

# Runs the test suite, the lint check and the packaged-build launch test on every push and pull request, so every
# commit's state is known before it's merged anywhere. The `changes` job skips those three for markdown/doc-image-only
# changes. workflow_dispatch also allows running it by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change needs the test, lint and bundle jobs. A change that touches only markdown files and
  # images under doc/ or examples/ skips them. This job always runs, so the `ci` job below still reports and a
  # docs-only pull request can satisfy the required check. Anything unclear (manual runs, a new branch, a diff that
  # can't be computed) runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The diff needs both ends of the range and their merge base.
          fetch-depth: 0

      - name: Look for changes outside docs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          # Markdown anywhere, or an image file under doc/ or examples/. No code reads these files.
          docs_only='(\.md$|^(doc|examples)/.*\.(png|jpe?g|gif|webp|svg)$)'
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            range="$PUSH_BEFORE...$PUSH_AFTER"
          else
            range=""
          fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range" 2>/dev/null) && [ -n "$files" ]; then
            echo "Changed files:"
            echo "$files"
            if echo "$files" | grep -qvE "$docs_only"; then
              code=true
            else
              code=false
            fi
          else
            echo "No usable diff for '$EVENT'; running everything."
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: test (python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The suite takes a few minutes. Anything much longer is a hang, like a modal dialog conftest.py failed to catch.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented minimum supported version; the newer ones guard against breakage as users upgrade.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      # Belt-and-suspenders: conftest.py also sets this, but making it explicit keeps the job's intent
      # (run Qt with no display) obvious and independent of the test harness.
      QT_QPA_PLATFORM: offscreen
      COVERAGE_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries
        # PySide6's offscreen plugin still needs EGL/GL, xkbcommon, glib, dbus and fontconfig present.
        # The bundled Linux libmypaint (lib/linux-x86_64/libmypaint.so) links against libjson-c.so.5.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Cython extension
        # IntraPaint.py normally builds this on launch; tests import src.util.visual.image_fill
        # directly, so build it ahead of time.
        run: python setup.py build_ext --inplace

      - name: Run tests
        if: matrix.python-version != env.COVERAGE_PYTHON
        run: python -m pytest

      # One matrix leg measures coverage (settings in .coveragerc), since tracing slows the suite. The report goes to
      # the run's summary page and an artifact. Nothing fails on the percentage yet.
      - name: Run tests with coverage
        if: matrix.python-version == env.COVERAGE_PYTHON
        run: coverage run -m pytest

      - name: Coverage report
        if: matrix.python-version == env.COVERAGE_PYTHON
        run: |
          coverage report
          coverage html
          {
            echo "## Coverage"
            echo
            coverage report --format=total | sed 's/$/% of src\/ (lines and branches)/'
            echo
            echo "<details><summary>Per-file coverage</summary>"
            echo
            coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.python-version == env.COVERAGE_PYTHON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: htmlcov/
          if-no-files-found: error
          retention-days: 14

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # scripts/pylint_baseline.json was generated with this version; pylint's inference can vary between them.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pylint (no new messages)
        run: python scripts/pylint_check.py

  # Builds the release bundles with PyInstaller and launch-tests them, since a bundle can break where a source run
  # works (see scripts/smoke_test_bundle.py). The uploaded artifacts are the release candidates.
  bundle:
    name: bundle (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # A Linux bundle needs at least the glibc of the machine that built it. 22.04's is just above the
            # PySide6 wheel's own minimum, so building there keeps the bundle running on older distros.
            os: ubuntu-22.04
            spec: IntraPaint-linux.spec
            executable: dist/IntraPaint
            artifact: IntraPaint-linux
          - name: windows
            os: windows-latest
            spec: IntraPaint.spec
            executable: dist/IntraPaint.exe
            artifact: IntraPaint-windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Bundles ship one Python. Keep it within requirements-dev.txt's pyinstaller support.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries
        if: runner.os == 'Linux'
        # The same libraries the test job installs: the launch test runs Qt offscreen, and PyInstaller copies
        # libmypaint's libjson-c.so.5 into the bundle from the system.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Cython extension
        # PyInstaller collects whichever image_fill is present, and the uncompiled .py fails at startup.
        run: |
          python setup.py build_ext --inplace
          python -c "import src.util.visual.image_fill as m; assert not m.__file__.endswith('.py'), m.__file__"

      - name: Build bundle
        run: pyinstaller --noconfirm ${{ matrix.spec }}

      - name: Launch test
        run: python scripts/smoke_test_bundle.py ${{ matrix.executable }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14

  # A single check to require for merging, so branch protection doesn't need updating whenever the matrix or the
  # set of jobs changes. The three jobs are skipped, not failed, for a docs-only change; that passes.
  ci:
    name: ci
    if: always()
    needs: [changes, test, lint, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: |
          needs.changes.result != 'success' ||
          (needs.changes.outputs.code == 'true' &&
            (needs.test.result != 'success' || needs.lint.result != 'success' || needs.bundle.result != 'success')) ||
          (needs.changes.outputs.code != 'true' &&
            (needs.test.result != 'skipped' || needs.lint.result != 'skipped' || needs.bundle.result != 'skipped'))
        run: |
          echo "changes result: ${{ needs.changes.result }} (code changed: ${{ needs.changes.outputs.code }})"
          echo "test result: ${{ needs.test.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          echo "bundle result: ${{ needs.bundle.result }}"
          exit 1

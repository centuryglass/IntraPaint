name: ci

# Runs the test suite, the lint and translation catalog checks, the markdown check and the packaged-build launch test
# on every push and pull request, so every commit's state is known before it's merged anywhere. The `changes` job skips
# the test, lint and bundle jobs for markdown/doc-image-only changes; the markdown check always runs. workflow_dispatch
# also allows running it by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change needs the test, lint and bundle jobs. A change that touches only markdown files and
  # images under doc/ or examples/ skips them. This job always runs, so the `ci` job below still reports and a
  # docs-only pull request can satisfy the required check. Anything unclear (manual runs, a new branch, a diff that
  # can't be computed) runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The diff needs both ends of the range and their merge base.
          fetch-depth: 0

      - name: Look for changes outside docs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          # Markdown anywhere, or an image file under doc/ or examples/. No code reads these files.
          docs_only='(\.md$|^(doc|examples)/.*\.(png|jpe?g|gif|webp|svg)$)'
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            # A new branch has an all-zero "before", and a force push's "before" may be gone from the clone. Both
            # fall back to everything the branch adds over integration.
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE...$PUSH_AFTER"
            else
              range="origin/integration...$PUSH_AFTER"
            fi
          else
            range=""
          fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range" 2>/dev/null) && [ -n "$files" ]; then
            echo "Changed files:"
            echo "$files"
            if echo "$files" | grep -qvE "$docs_only"; then
              code=true
            else
              code=false
            fi
          else
            echo "No usable diff for '$EVENT'; running everything."
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: test (python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A job takes 5-9 minutes including setup. Anything much longer is a hang, like a modal dialog conftest.py failed to
    # catch.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented minimum supported version; the newer ones guard against breakage as users upgrade.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      # Belt-and-suspenders: conftest.py also sets this, but making it explicit keeps the job's intent
      # (run Qt with no display) obvious and independent of the test harness.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries
        # PySide6's offscreen plugin still needs EGL/GL, xkbcommon, glib, dbus and fontconfig present.
        # The bundled Linux libmypaint (lib/linux-x86_64/libmypaint.so) links against libjson-c.so.5.
        # gdb reads the core dump a crashing test leaves (see "Native backtraces").
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5 gdb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Cython extension
        # IntraPaint.py normally builds this on launch; tests import src.util.visual.image_fill
        # directly, so build it ahead of time.
        run: python setup.py build_ext --inplace

      # A crashing test leaves a core file in CORE_DIR for the "Native backtraces" step. The runner's default
      # core_pattern hands cores to apport, which doesn't keep them for this job's Python. The core size limit is
      # per shell, so "Run tests" raises it in its own.
      - name: Enable core dumps
        run: |
          CORE_DIR=$RUNNER_TEMP/cores
          echo "CORE_DIR=$CORE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CORE_DIR"
          sudo sysctl -w kernel.core_pattern="$CORE_DIR/core.%p"

      - name: Run tests
        # The panel sweep runs in the `sweep` job.
        run: |
          ulimit -c unlimited
          python -m pytest --ignore=test/ui/panel_sweep_test.py

      # When a test crashes the interpreter, faulthandler prints only the Python stack (plus unnamed native frames on
      # 3.14). gdb names the native function in every thread, with file and line where a library ships symbols, and
      # the locals in the crashing thread's innermost frames. The backtraces go to the log and an artifact; the job
      # still fails.
      - name: Native backtraces
        if: failure()
        run: |
          shopt -s nullglob
          cores=("$CORE_DIR"/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core dumps; the failure wasn't a crash."
            exit 0
          fi
          python=$(realpath "$(python -c 'import sys; print(sys.executable)')")
          mkdir -p "$RUNNER_TEMP/backtraces"
          for core in "${cores[@]}"; do
            out="$RUNNER_TEMP/backtraces/$(basename "$core").txt"
            gdb -batch -nx -iex 'set debuginfod enabled off' -iex 'set print elements 16' \
              -ex 'thread apply all bt' -ex 'echo \n--- crashing thread, innermost frames with locals ---\n' \
              -ex 'bt full 20' \
              "$python" "$core" > "$out" 2>&1 || true
            echo "::group::Native backtrace: $(basename "$core")"
            cat "$out"
            echo "::endgroup::"
          done

      - name: Upload native backtraces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-backtraces-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/backtraces/
          if-no-files-found: ignore
          retention-days: 14

  # Runs the panel sweep (test/ui/panel_sweep_test.py), which makes up a large share of the suite's runtime, on its own
  # runners so it stays off the test jobs' critical path. Its tests are split across SHARDS jobs by collection order.
  # Layout depends on Qt, the fonts and the style, not the Python version, so one version covers it. Local runs of
  # `pytest` still include the sweep.
  sweep:
    name: sweep (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A shard takes 2-3 minutes including setup.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      QT_QPA_PLATFORM: offscreen
      SHARDS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries
        # The same libraries as the test job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Cython extension
        run: python setup.py build_ext --inplace

      - name: Run this shard's sweep tests
        run: |
          python -m pytest test/ui/panel_sweep_test.py --collect-only -q | grep '::' > "$RUNNER_TEMP/all.txt"
          awk -v shards="$SHARDS" -v shard="${{ matrix.shard }}" '(NR - 1) % shards == shard' "$RUNNER_TEMP/all.txt" \
            > "$RUNNER_TEMP/shard.txt"
          echo "Shard ${{ matrix.shard }} of $SHARDS:"
          cat "$RUNNER_TEMP/shard.txt"
          python -m pytest $(cat "$RUNNER_TEMP/shard.txt")

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # scripts/pylint_baseline.json was generated with this version; pylint's inference can vary between them.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pylint (no new messages)
        run: python scripts/pylint_check.py

      # Fails when a source change leaves resources/translations/ out of date, or a translation drops a placeholder.
      - name: Translation catalog
        if: ${{ !cancelled() }}
        run: python scripts/build_translations.py --check

  # Lints the tracked Markdown files. It runs for every change, since its inputs are the documents a docs-only change
  # edits, and it needs only PyMarkdown, so it installs that instead of requirements-dev.txt.
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install PyMarkdown
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^pymarkdownlnt==' requirements-dev.txt)"

      - name: PyMarkdown
        run: python scripts/markdown_lint.py

  # Builds the release bundles with PyInstaller and launch-tests them, since a bundle can break where a source run
  # works (see scripts/smoke_test_bundle.py). The uploaded artifacts are the release candidates.
  bundle:
    name: bundle (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # A Linux bundle needs at least the glibc of the machine that built it. 22.04's is just above the
            # PySide6 wheel's own minimum, so building there keeps the bundle running on older distros.
            os: ubuntu-22.04
            spec: IntraPaint-linux.spec
            executable: dist/IntraPaint
            artifact: IntraPaint-linux
          - name: windows
            os: windows-latest
            spec: IntraPaint.spec
            executable: dist/IntraPaint.exe
            artifact: IntraPaint-windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Bundles ship one Python. Keep it within requirements-dev.txt's pyinstaller support.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries
        if: runner.os == 'Linux'
        # The same libraries the test job installs: the launch test runs Qt offscreen, and PyInstaller copies
        # libmypaint's libjson-c.so.5 into the bundle from the system.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Cython extension
        # PyInstaller collects whichever image_fill is present, and the uncompiled .py fails at startup.
        run: |
          python setup.py build_ext --inplace
          python -c "import src.util.visual.image_fill as m; assert not m.__file__.endswith('.py'), m.__file__"

      - name: Build bundle
        run: pyinstaller --noconfirm ${{ matrix.spec }}

      - name: Launch test
        run: python scripts/smoke_test_bundle.py ${{ matrix.executable }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14

  # A single check to require for merging, so branch protection doesn't need updating whenever the matrix or the
  # set of jobs changes. The test, sweep, lint and bundle jobs are skipped, not failed, for a docs-only change; that passes.
  ci:
    name: ci
    if: always()
    needs: [changes, test, sweep, lint, markdown, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: |
          needs.changes.result != 'success' || needs.markdown.result != 'success' ||
          (needs.changes.outputs.code == 'true' &&
            (needs.test.result != 'success' || needs.sweep.result != 'success' || needs.lint.result != 'success' ||
             needs.bundle.result != 'success')) ||
          (needs.changes.outputs.code != 'true' &&
            (needs.test.result != 'skipped' || needs.sweep.result != 'skipped' || needs.lint.result != 'skipped' ||
             needs.bundle.result != 'skipped'))
        run: |
          echo "changes result: ${{ needs.changes.result }} (code changed: ${{ needs.changes.outputs.code }})"
          echo "test result: ${{ needs.test.result }}"
          echo "sweep result: ${{ needs.sweep.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          echo "markdown result: ${{ needs.markdown.result }}"
          echo "bundle result: ${{ needs.bundle.result }}"
          exit 1

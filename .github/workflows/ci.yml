name: ci

# Runs the test suite and the lint check on every push and pull request, so every commit's state is known before
# it's merged anywhere. workflow_dispatch also allows running it by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite takes a few minutes. Anything much longer is a hang, like a modal dialog conftest.py failed to catch.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented minimum supported version; the newer ones guard against breakage as users upgrade.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      # Belt-and-suspenders: conftest.py also sets this, but making it explicit keeps the job's intent
      # (run Qt with no display) obvious and independent of the test harness.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries
        # PySide6's offscreen plugin still needs EGL/GL, xkbcommon, glib, dbus and fontconfig present.
        # The bundled Linux libmypaint.so (lib/libmypaint.so) links against libjson-c.so.5.
        # Ghostscript lets the image format test read back the EPS and PS files it saves.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libjson-c5 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Cython extension
        # IntraPaint.py normally builds this on launch; tests import src.util.visual.image_fill
        # directly, so build it ahead of time.
        run: python setup.py build_ext --inplace

      - name: Run tests
        run: python -m pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # scripts/pylint_baseline.json was generated with this version; pylint's inference can vary between them.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pylint (no new messages)
        run: python scripts/pylint_check.py

  # A single check to require for merging, so branch protection doesn't need updating whenever the matrix or the
  # set of jobs changes.
  ci:
    name: ci
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.test.result != 'success' || needs.lint.result != 'success'
        run: |
          echo "test result: ${{ needs.test.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          exit 1

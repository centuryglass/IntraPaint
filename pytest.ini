[pytest]
# Only scan the test directory. This keeps pytest out of src/ (which contains production modules such
# as controller/image_generation/test_generator.py whose names would otherwise trip collection).
testpaths = test

# The suite follows a `<name>_test.py` file convention with classes named either `Test*` or `*Test`.
# unittest.TestCase subclasses are collected regardless, but these globs also cover plain pytest-style
# classes/functions if any are added later.
python_files = *_test.py test_*.py
python_classes = Test* *Test
python_functions = test_*

# -ra: show a short summary of everything except passes (skips, failures, errors) at the end.
# --strict-markers: fail on unknown @pytest.mark.* names so typos don't silently disable a marker.
addopts = -ra --strict-markers

# Headless Qt is configured in conftest.py (QT_QPA_PLATFORM=offscreen), which must be set before
# PySide6 is imported. It is intentionally not set here because pytest.ini cannot set env vars.
